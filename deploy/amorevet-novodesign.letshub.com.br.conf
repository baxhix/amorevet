# Nginx — subdomínio do novo design
# Destino: /etc/nginx/sites-available/amorevet-novodesign.letshub.com.br
# Serve o app (container na porta 3003) e mostra /novodesign na raiz.
# O bloco 443 (SSL) é adicionado automaticamente pelo certbot.

server {
    listen 80;
    listen [::]:80;
    server_name amorevet.novodesign.letshub.com.br;

    # tamanho de upload (imagens do admin)
    client_max_body_size 20M;

    # A raiz "/" mostra o novo design
    location = / {
        proxy_pass http://127.0.0.1:3003/novodesign;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Demais rotas, assets (_next/*), API etc. passam direto para o app
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
